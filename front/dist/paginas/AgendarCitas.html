<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agendar Cita — DentalCare</title>
<link rel="stylesheet" href="../CSS/style.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="menu">
<div class="logo_contenedor">
    <span class="logo_icono">✦</span>
    <div class="encabezado_titulo">
      <h1>DentalCare <span class="badge_admin">Paciente</span></h1>
    </div>
</div>
<ul class="menu_links">
    <li><a href="../../index.html">Inicio</a></li>
    <li><a href="../paginas/PanelControlHorarios.html">Mis Agendas</a></li>
    <li><a href="../paginas/AltaProfesionales.html">Agendar Cita</a></li>
</ul>
</nav>

<div class="container py-4">
    <h4 class="mb-4">Agendar Cita</h4>

    <div class="card p-4" style="max-width:600px">
    <div class="mb-3">
        <label class="form-label">Nombre del paciente</label>
        <input type="text" class="form-control" placeholder="Ej: Juan Pérez">
    </div>
    <div class="mb-3">
        <label class="form-label">Odontólogo</label>
        <select class="form-select">
        <option>Dra. Ana López — Ortodoncia</option>
        <option>Dr. Jorge Fernández — Endodoncia</option>
        <option>Dr. Martín Ruiz — Implantes</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Tratamiento</label>
        <select class="form-select">
        <option>Limpieza dental</option>
        <option>Ortodoncia</option>
        <option>Endodoncia</option>
        <option>Revisión general</option>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Fecha</label>
        <input type="date" class="form-control">
    </div>
    <div class="mb-4">
        <label class="form-label">Hora</label>
        <input type="time" class="form-control">
    </div>
    <div class="d-flex justify-content-end gap-2">
        <a href="../../index.html" class="btn btn-outline-dark">Cancelar</a>
        <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#modalExito">Agendar Cita</button>
    </div>
    </div>
</div>

    <div class="modal fade" id="modalExito" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
        <div class="modal-header bg-dark text-white">
            <h5 class="modal-title">Cita Agendada</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
        <div class="fs-1 mb-2">✅</div>
            <h5>¡Tu cita fue agendada correctamente!</h5>
            <p class="text-muted">Podés ver el detalle en Mis Agendas.</p>
        </div>
        <div class="modal-footer">
            <button class="btn btn-outline-dark" data-bs-dismiss="modal">Continuar</button>
            <a href="MisAgendas.html" class="btn btn-dark">Ver mis citas</a>
        </div>
    </div>
    </div>
</div>

  <footer class="bg-dark text-white text-center py-3 mt-4">
    DentalCare © 2025 — Todos los derechos reservados
</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
